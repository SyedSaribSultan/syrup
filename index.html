<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarah & James Wedding Invitation</title>
    <style>
        :root {
            --bg-color: #fcfbf9;
            --text-color: #2c2a29;
            --accent-color: #8c7853;
            --light-accent: #eef2ec;
            --border-color: #e3ded8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .invitation-card {
            background: white;
            border: 1px solid var(--border-color);
            max-width: 600px;
            width: 90%;
            margin: 40px auto;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            border-radius: 4px;
        }

        .names {
            font-family: "Georgia", serif;
            font-size: 2.5rem;
            font-weight: normal;
            margin: 20px 0;
            color: var(--accent-color);
            letter-spacing: 2px;
        }

        .subtitle {
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 4px;
            color: #666;
            margin-bottom: 30px;
        }

        .details {
            font-size: 1.1rem;
            margin: 30px 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 30px 0;
        }

        .date, .location {
            margin: 10px 0;
        }

        .date {
            font-weight: 600;
            font-size: 1.2rem;
        }

        .rsvp-btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 14px 32px;
            text-decoration: none;
            border-radius: 2px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: background 0.2s ease;
            margin-top: 20px;
        }

        .rsvp-btn:hover {
            background-color: #726040;
        }

        .footer-note {
            font-size: 0.9rem;
            color: #777;
            margin-top: 40px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="invitation-card">
        <div class="subtitle">Together with their families</div>
        
        <h1 class="names">Sarah & James</h1>
        
        <p>pancake</p>

        <div class="details">
            <div class="date">Saturday, the Eighteenth of June</div>
            <div>Two Thousand Twenty-Six</div>
            <div style="margin: 15px 0 0 0;" class="location">The Glasshouse Botanical Gardens</div>
            <div style="font-size: 0.95rem; color: #555;">Seattle, Washington</div>
        </div>

        <p>Reception to follow with dinner, drinks, and dancing.</p>

        <a href="#rsvp" class="rsvp-btn">RSVP Here</a>

        <div class="footer-note">
            Kindly reply by the first of May
        </div>
    </div>

</body>
</html>
