# Typecheck, lint and the network-free test scripts on every push and pull request (audit 2026-10-15 M5).
# Never runs evals, benches, test:llm-proxy or anything that calls a model provider or creates a sandbox.
# Left out for now: test:router (scenario z9 fails on main, under investigation) and test:numbers (timing checks
# under 50 ms that flake on loaded machines).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # PageProps, LayoutProps and RouteContext are generated route types (.next/types), git-ignored.
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:transcript
      - run: pnpm test:diffs
      - run: pnpm test:guard
      # test:rich renders the HTML export in headless Chromium (local only, no network).
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:rich
      - run: pnpm test:eval-checks
      - run: pnpm test:plugin
