allowBuilds:
  core-js: false
  esbuild: true
  sharp: false
  unrs-resolver: false
# Security floors for transitive deps (pnpm audit, 2026-10-09). Drop each once its parent ships the fix.
overrides:
  sharp@<0.35.5: ^0.35.5
  source-map-js@<1.2.2: ^1.2.2
  katex@<0.18.2: 0.19.0
  # Dev-only (audit 2026-10-15 L5): drizzle-kit > @esbuild-kit/core-utils. The braces advisory (eslint-config-next >
  # micromatch, dev-only) has no patched release on npm yet (3.0.3 is the latest), so it cannot be overridden.
  esbuild@<0.24.3: ^0.28.2
  # Dependabot alerts 2026-10-25: transitive floors (MCP SDK > ajv/express/express-rate-limit/hono; @vercel/sandbox > undici;
  # @vercel/oidc > @vercel/cli-config > zod 4.1.x). Drop each once its parent ships the fix.
  undici@>=7.0.0 <7.30.1: ^7.30.1
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  body-parser@>=2.0.0 <2.4.0: ^2.4.0
  ip-address@<10.7.4: ^10.7.4
  hono@<4.13.11: ^4.13.11
  zod@>=4.0.0 <4.6.6: ^4.6.6
  dompurify@<3.4.17: ^3.4.17
